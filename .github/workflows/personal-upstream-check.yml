name: Personal fork upstream compatibility

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Test conflict detection
        run: node --test scripts/personal-upstream.test.mjs
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/get-bb/bb.git
          git fetch --prune upstream main
      - name: Check compatibility
        run: node scripts/personal-upstream.mjs check --no-fetch
